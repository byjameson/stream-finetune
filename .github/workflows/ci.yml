name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest safetensors numpy scikit-learn scipy joblib
      - name: Unit tests (CPU only)
        run: python -m pytest tests -q
      - name: Deterministic safety and injection red-team
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python research/redteam_safety.py --out /tmp/redteam_safety.json
          python research/redteam_injection.py --out /tmp/redteam_injection.json
      - name: Package builds and installs
        run: |
          pip install build
          python -m build
          python -m pip install --no-deps dist/*.whl
          streamft --help
