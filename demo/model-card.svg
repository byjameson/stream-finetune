<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     role="img" aria-labelledby="title desc">
  <title id="title">AI in an SVG - SMS spam model card</title>
  <desc id="desc">A 1,579-byte int8 SMS spam classifier in the tinyai metadata.</desc>
  <rect width="900" height="560" fill="#0f1115"/>
  <rect x="0" y="0" width="900" height="8" fill="#6ee7b7"/>
  <text x="60" y="74" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700" letter-spacing="1">1,579 B MODEL - 93.54%</text>
  <text x="60" y="140" fill="#e8e6e3" font-family="Arial, Helvetica, sans-serif"
        font-size="46" font-weight="700">AI in an SVG</text>
  <text x="60" y="180" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif"
        font-size="17">A 160-word SMS spam classifier in the /metadata payload.</text>
  <rect x="60" y="220" width="780" height="1" fill="#232733"/>
  <text x="60" y="280" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">160</text><text x="60" y="300" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif" font-size="12">words</text>
  <text x="280" y="280" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">2</text><text x="280" y="300" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif" font-size="12">labels</text>
  <text x="500" y="280" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1,579 B</text><text x="500" y="300" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif" font-size="12">int8 weights</text>
  <text x="720" y="280" fill="#6ee7b7" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">93.54%</text><text x="720" y="300" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif" font-size="12">1,115 held out</text>
  <rect x="60" y="320" width="780" height="1" fill="#232733"/>
  <text x="60" y="330" fill="#e8e6e3" font-family="Arial, Helvetica, sans-serif" font-size="15">The visible card is a model card.</text><text x="60" y="354" fill="#e8e6e3" font-family="Arial, Helvetica, sans-serif" font-size="15">The classifier is in the &lt;metadata&gt; element, not drawn.</text><text x="60" y="378" fill="#e8e6e3" font-family="Arial, Helvetica, sans-serif" font-size="15">Open svg.html to parse the vector file and classify.</text>
  <text x="60" y="480" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif"
        font-size="13">SMS Spam Collection; Complement NB; int8 weights. Not an LLM.</text>
  <text x="60" y="504" fill="#9aa0aa" font-family="Arial, Helvetica, sans-serif"
        font-size="13">The SVG is a lossless container, not obfuscation.</text>
  <metadata id="tinyai" data-sha256="cae4bbed4f438ebec79ab765bf19b2066809509278991dd95c184954d8706b0a"></metadata>
</svg>
