function tokens(s) {
  return [...new Set((s.toLowerCase().match(/[\p{L}\p{N}]{2,}/gu) || []))];
}
function trainCNB(rows, maxVocab) {
  const labels = [...new Set(rows.map(r => r.label))].sort();
  const keep = maxVocab ? topTokens(rows, maxVocab) : null;
  const counts = {}, totals = {}, featureAll = new Map(), vocab = new Set();
  for (const l of labels) { counts[l] = new Map(); totals[l] = 0; }
  for (const r of rows) {
    for (const t of tokens(r.text)) {
      if (keep && !keep.has(t)) continue;
      counts[r.label].set(t, (counts[r.label].get(t) || 0) + 1);
      totals[r.label]++;
      vocab.add(t);
      featureAll.set(t, (featureAll.get(t) || 0) + 1);
    }
  }
  const allTot = [...featureAll.values()].reduce((a, b) => a + b, 0);
  return { labels, counts, totals, vocab, featureAll, allTot, alpha: 1, n: rows.length };
}
function score(m, text) {
  const s = {};
  for (const l of m.labels) s[l] = 0;
  for (const t of tokens(text)) {
    if (!m.vocab.has(t)) continue;
    const fa = m.featureAll.get(t);
    for (const l of m.labels) {
      const c = m.counts[l].get(t) || 0;
      const den = m.allTot + m.alpha * m.vocab.size - m.totals[l];
      s[l] += -Math.log((fa + m.alpha - c) / den);
    }
  }
  let best = m.labels[0];
  for (const l of m.labels) if (s[l] > s[best]) best = l;
  const mx = Math.max(...m.labels.map(l => s[l]));
  const ex = {}; let sum = 0;
  for (const l of m.labels) { ex[l] = Math.exp(s[l] - mx); sum += ex[l]; }
  const probs = {};
  for (const l of m.labels) probs[l] = ex[l] / sum;
  return { label: best, probs };
}
