# /etc/nginx/conf.d/spiking.conf
# TLS is expected to be managed by certbot or your certificate mount.
# The app already supports Bearer auth; clients send Authorization through.

limit_req_zone $binary_remote_addr zone=spiking:10m rate=6r/m;

server {
    listen 443 ssl http2;
    server_name spiking.example.com;

    ssl_certificate     /etc/letsencrypt/live/spiking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiking.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        limit_req zone=spiking burst=5 nodelay;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

server {
    listen 80;
    server_name spiking.example.com;
    return 301 https://$host$request_uri;
}
