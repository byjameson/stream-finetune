[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamft"
version = "0.9.1"
description = "streamft: low-VRAM fine-tuning for models that do not fit, plus Atom Zero, a local source-cited 49.2M assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gokhan Cava", email = "gokhancava@gmail.com" }]
keywords = ["atom-zero", "local-assistant", "rag", "source-citation", "fine-tuning", "qlora", "nf4", "low-vram", "lora", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "transformers>=4.40",
  "safetensors",
  "tokenizers",
  "accelerate",
  "datasets",
  "huggingface-hub",
  "numpy",
  "psutil",
  "bitsandbytes",
  "pypdf>=4",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Compatibility aliases. The training stack is in the default install so
# existing `pip install streamft` users keep the trainer.
train = [
  "transformers>=4.40",
  "safetensors",
  "accelerate",
  "datasets",
  "huggingface-hub",
  "bitsandbytes",
]
# Kept as a compatibility alias; transformers is already a core dependency.
neural = ["transformers>=4.40"]
dev = [
  "pytest>=8.0",
  "peft>=0.21",
  "scikit-learn",
  "scipy",
  "joblib",
  "safetensors",
]

[project.scripts]
streamft = "streamft.__main__:main"
atomzero = "streamft.chat_server:main"

[project.urls]
Homepage = "https://github.com/byjameson/stream-finetune"
Issues = "https://github.com/byjameson/stream-finetune/issues"
LinkedIn = "https://www.linkedin.com/in/g%C3%B6khan-cava-874a32157/"

[tool.setuptools]
packages = ["streamft"]
license-files = ["LICENSE", "NOTICE"]
