[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamft"
version = "1.0.0"
description = "streamft: fine-tune models that do not fit in VRAM with streaming NF4 and LoRA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gokhan Cava", email = "gokhancava@gmail.com" }]
keywords = ["fine-tuning", "qlora", "nf4", "low-vram", "lora", "llm", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "transformers>=4.40",
  "safetensors",
  "tokenizers",
  "accelerate",
  "datasets",
  "huggingface-hub",
  "numpy",
  "psutil",
  "bitsandbytes",
]

[project.optional-dependencies]
# Compatibility alias for scripts written against 0.9.x.
train = [
  "transformers>=4.40",
  "safetensors",
  "accelerate",
  "datasets",
  "huggingface-hub",
  "bitsandbytes",
]
dev = [
  "pytest>=8.0",
  "peft>=0.21",
  "scikit-learn",
  "scipy",
  "joblib",
  "safetensors",
]

[project.scripts]
streamft = "streamft.__main__:main"

[project.urls]
Homepage = "https://github.com/byjameson/stream-finetune"
Source = "https://github.com/byjameson/stream-finetune"
Documentation = "https://github.com/byjameson/stream-finetune/blob/main/docs/PROJECT_OVERVIEW.md"
"Trainer guide" = "https://github.com/byjameson/stream-finetune/blob/main/GUIDE_6GB_32B.md"
"Benchmarks" = "https://github.com/byjameson/stream-finetune/blob/main/docs/BENCHMARKS.md"
Issues = "https://github.com/byjameson/stream-finetune/issues"
LinkedIn = "https://www.linkedin.com/in/g%C3%B6khan-cava-874a32157/"

[tool.setuptools]
packages = ["streamft"]
license-files = ["LICENSE", "NOTICE"]
